<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第9章 复数</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
            background: linear-gradient(135deg, #1C2B1C 0%, #1A1A1A 100%);
            min-height: 100vh;
            color: #E8E8E8;
        }

        .slide {
            width: 100%;
            min-height: 100vh;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            position: relative;
            border-bottom: 3px solid #2A3A2A;
        }

        .slide:last-child {
            border-bottom: none;
        }

        /* 封面页样式 */
        .cover-slide {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .cover-slide .main-title {
            font-size: 5rem;
            font-weight: bold;
            color: #E8E8E8;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            letter-spacing: 8px;
        }

        .cover-slide .subtitle {
            font-size: 1.8rem;
            color: #FFE566;
            margin-bottom: 60px;
            letter-spacing: 4px;
        }

        .cover-slide .formula-showcase {
            font-size: 3rem;
            margin-top: 40px;
            padding: 30px 50px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* 导航页样式 */
        .nav-slide {
            justify-content: flex-start;
        }

        .nav-slide .section-title {
            font-size: 2.5rem;
            color: #FFE566;
            margin-bottom: 50px;
            padding-bottom: 15px;
            border-bottom: 3px solid #FFE566;
            display: inline-block;
        }

        .chapter-structure {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 30px;
        }

        .chapter-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 30px 40px;
            border-left: 5px solid #66B3FF;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .chapter-item:hover {
            transform: translateX(10px);
            background: rgba(255,255,255,0.08);
        }

        .chapter-item .chapter-num {
            font-size: 1.5rem;
            color: #66B3FF;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chapter-item .chapter-title {
            font-size: 1.8rem;
            color: #E8E8E8;
            margin-bottom: 15px;
        }

        .chapter-item .chapter-topics {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .topic-tag {
            background: rgba(144,238,144,0.2);
            color: #90EE90;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            border: 1px solid rgba(144,238,144,0.3);
        }

        /* 引入页样式 */
        .intro-slide {
            justify-content: flex-start;
        }

        .intro-slide .section-title {
            font-size: 2.5rem;
            color: #FFE566;
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 3px solid #FFE566;
            display: inline-block;
        }

        .problem-box {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 40px;
            margin: 30px 0;
            border: 2px solid rgba(255,153,153,0.3);
        }

        .problem-title {
            font-size: 1.5rem;
            color: #FF9999;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .problem-content {
            font-size: 1.3rem;
            line-height: 2;
            color: #E8E8E8;
        }

        .math-expression {
            font-size: 1.6rem;
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            text-align: center;
        }

        .highlight-box {
            background: rgba(255,229,102,0.1);
            border: 2px solid #FFE566;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        .highlight-title {
            font-size: 1.4rem;
            color: #FFE566;
            margin-bottom: 15px;
        }

        /* 颜色类 */
        .color-real { color: #90EE90; }
        .color-imag { color: #FF9999; }
        .color-i { color: #66B3FF; }
        .color-emph { color: #FFE566; }

        /* 页码 */
        .page-number {
            position: absolute;
            bottom: 30px;
            right: 50px;
            font-size: 1rem;
            color: rgba(255,255,255,0.4);
        }

        /* 装饰元素 */
        .chalk-dust {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .chalk-dust.top-right {
            top: 50px;
            right: 50px;
        }

        .chalk-dust.bottom-left {
            bottom: 100px;
            left: 50px;
        }
    </style>
</head>
<body>

    <!-- 幻灯片1: 封面页 -->
    <div class="slide cover-slide">
        <div class="chalk-dust top-right"></div>
        <div class="chalk-dust bottom-left"></div>
        
        <h1 class="main-title">第9章 复数</h1>
        <p class="subtitle">Complex Numbers</p>
        
        <div class="formula-showcase">
            <span class="color-real">a</span> + <span class="color-imag">b</span><span class="color-i">i</span>
        </div>
        
        <div class="page-number">1 / 3</div>
    </div>

    <!-- 幻灯片2: 章节导航页 -->
    <div class="slide nav-slide">
        <div class="chalk-dust top-right"></div>
        
        <h2 class="section-title">本章内容导航</h2>
        
        <div class="chapter-structure">
            <div class="chapter-item">
                <div class="chapter-num">9.1</div>
                <div class="chapter-title">复数及其四则运算</div>
                <div class="chapter-topics">
                    <span class="topic-tag">复数的概念</span>
                    <span class="topic-tag">复数的相等</span>
                    <span class="topic-tag">复数的加减法</span>
                    <span class="topic-tag">复数的乘除法</span>
                </div>
            </div>
            
            <div class="chapter-item">
                <div class="chapter-num">9.2</div>
                <div class="chapter-title">复数的几何意义</div>
                <div class="chapter-topics">
                    <span class="topic-tag">复平面</span>
                    <span class="topic-tag">复数的模</span>
                    <span class="topic-tag">共轭复数</span>
                    <span class="topic-tag">复数运算的几何意义</span>
                </div>
            </div>
        </div>
        
        <div class="page-number">2 / 3</div>
    </div>

    <!-- 幻灯片3: 引入页 -->
    <div class="slide intro-slide">
        <div class="chalk-dust bottom-left"></div>
        
        <h2 class="section-title">问题引入</h2>
        
        <div class="problem-box">
            <div class="problem-title">❓ 思考问题</div>
            <div class="problem-content">
                在实数范围内，方程 <span class="color-emph">x² = -1</span> 没有解。<br>
                但是，如果我们想要解这个方程，该怎么办呢？
            </div>
            
            <div class="math-expression">
                x² = -1  ⇒  x = <span class="color-emph">?</span>
            </div>
        </div>
        
        <div class="highlight-box">
            <div class="highlight-title">💡 核心问题</div>
            <div style="font-size: 1.2rem; line-height: 1.8;">
                负数可以开平方吗？如果能，结果是什么形式的数？<br><br>
                历史上，数学家们为了解决这类问题，<span class="color-emph">引入了虚数单位 i</span>，定义为：<br>
                <div style="text-align: center; margin-top: 15px; font-size: 1.5rem;">
                    <span class="color-i">i² = -1</span>  或  <span class="color-i">i = √(-1)</span>
                </div>
            </div>
        </div>
        
        <div class="page-number">3 / 3</div>
    </div>

</body>
</html>
